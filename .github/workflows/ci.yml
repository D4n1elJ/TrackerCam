name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core logic (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # TrackerCamCore is framework-free and validated with Swift Testing via `swift test`.
      # The package declares swift-tools-version 6.2 and the app targets iOS 26, so the runner's
      # default /Applications/Xcode.app symlink (16.4 on macos-15) is too old — select the newest
      # installed Xcode by version instead.
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Validate core
        run: make validate-core

  app:
    name: App build (simulator)
    runs-on: macos-15
    # Only on PRs: the iOS app build needs the iOS SDK/simulator and is slower. The core job is the
    # fast required gate; this catches app-layer breakage before merge.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Same as the core job: the iOS 26 deployment target needs the newest installed Xcode/SDK,
      # not the runner's default symlink.
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # `make validate-sim` regenerates the project (so a new source file can't silently break the
      # build) and builds for a generic iOS Simulator destination without code signing.
      - name: Validate simulator build
        run: make validate-sim

      - name: Validate app tests compile
        run: make validate-app-tests
