# XcodeGen project spec for TrackerCam. See PLAN.md §16.
#
# Generate the Xcode project on a machine with full Xcode + XcodeGen:
#   brew install xcodegen
#   cd <repo>/trackercam && xcodegen generate
#   open TrackerCam.xcodeproj
#
# The app links the local, framework-free TrackerCamCore package (unit-tested via
# TrackerCamCore/Scripts/verify.sh, or `swift test` in a healthy toolchain).

name: TrackerCam
options:
  bundleIdPrefix: com.trackercam
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TrackerCamCore:
    path: TrackerCamCore

targets:
  TrackerCam:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TrackerCam
        excludes:
          - ML/MODEL_SPEC.md
    dependencies:
      - package: TrackerCamCore
        product: TrackerCamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackercam.app
        INFOPLIST_FILE: TrackerCam/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrackerCam/App/TrackerCam.entitlements
        DEVELOPMENT_TEAM: DZNC8GD6WJ
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1
        # Launch screen, supported orientations, and the scene manifest are declared directly in
        # TrackerCam/App/Info.plist (authoritative). They are NOT set via INFOPLIST_KEY_* here
        # because those only apply when GENERATE_INFOPLIST_FILE is YES; with an explicit
        # INFOPLIST_FILE and generation off they were silently ignored, which dropped the launch
        # screen and made the app render in scaled (zoomed-in) compatibility mode.
